<title>NORDTEX HUB</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#fff; --ink:#17212b; --muted:#667085; --line:#e4e7ec; --brand:#676568; --accent:#c8102e;
  --ok:#1f8a4c; --ok-bg:#e7f6ed; --warn:#a15c00; --warn-bg:#fff4e0; --bad:#b42318; --bad-bg:#fdecea; --info-bg:#eaf2ff;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; color:var(--ink); background:var(--bg);
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:#1d4ed8;text-decoration:none} a:hover{text-decoration:underline}
h1{font-size:1.55rem;margin:0 0 .2rem;letter-spacing:-.01em} h2{font-size:1.02rem;margin:0 0 .75rem} h3{font-size:.92rem;margin:.75rem 0 .4rem;color:var(--muted)}
.muted{color:var(--muted)} .fine{font-size:.78rem;color:var(--muted)} small{font-size:.8rem}
.error{color:var(--bad)} .warn-text{color:var(--warn);display:block} .bad-text{color:var(--bad);display:block}
/* struttura */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--brand);color:#cfd6de;display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh}
.brand{font-weight:800;letter-spacing:.14em;color:#fff;font-size:1.15rem;padding:4px 10px 18px}
.brand span{font-weight:500;letter-spacing:.05em;color:var(--accent);margin-left:6px;font-size:.85rem}
.side nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-item{display:flex;gap:10px;align-items:center;color:#cfd6de;padding:9px 10px;border-radius:8px;font-weight:500}
.nav-item:hover{background:rgba(255,255,255,.07);text-decoration:none}
.nav-item.active{background:rgba(255,255,255,.13);color:#fff}
.ico{width:20px;text-align:center;opacity:.85}
.who{border-top:1px solid rgba(255,255,255,.12);padding:12px 10px 0;display:flex;flex-direction:column}
.who strong{color:#fff} .who small{color:#9aa6b2} .who .link{color:#9aa6b2;text-align:left;padding:4px 0}
.who-name{text-decoration:none} label.btn input[type=file]{display:none} label.btn{cursor:pointer}
.main{min-width:0}
.page{padding:28px 32px 48px;max-width:1240px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.tabbar{display:none}
/* componenti */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px} .grid2>.card{margin-bottom:0} .grid2{margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);color:var(--ink);display:flex;flex-direction:column}
a.kpi:hover{text-decoration:none;border-color:#c9ced6}
.kpi small{color:var(--muted)} .kpi strong{font-size:1.6rem;letter-spacing:-.02em} .kpi span{color:var(--muted);font-size:.85rem}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:#f1f3f6;text-decoration:none} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff} .btn.primary:hover{background:#24323f}
.btn.primary.attn{box-shadow:0 0 0 3px rgba(200,16,46,.25)}
.btn.ghost{background:transparent} .btn.small{padding:5px 10px;font-size:.85rem}
.link{background:none;border:none;color:#1d4ed8;cursor:pointer;font:inherit;padding:0}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:1rem;padding:4px 8px;border-radius:6px} .icon-btn:hover{background:#f1f3f6}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600;background:#eef1f5;color:#344054;margin-right:4px}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.bad{background:var(--bad-bg);color:var(--bad)} .badge.muted{background:#eef1f5;color:#475467}
.badges{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.alert{padding:10px 14px;border-radius:10px;margin:0 0 14px} .alert.warn{background:var(--warn-bg);color:#7a4500} .alert.bad{background:var(--bad-bg);color:var(--bad)} .alert.info{background:var(--info-bg);color:#1e3a8a}
input,select,textarea{font:inherit;color:var(--ink);border:1px solid #d0d5dd;border-radius:9px;padding:8px 10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:#7a8ca3;box-shadow:0 0 0 3px rgba(20,32,43,.08)}
input[type=checkbox]{width:auto} textarea{resize:vertical}
.form{display:flex;flex-direction:column;gap:10px} .form.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.field{display:flex;flex-direction:column;gap:4px} .field>span{font-size:.82rem;font-weight:600;color:#344054} .field small{color:var(--muted)}
fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px} legend{font-size:.82rem;color:var(--muted);padding:0 4px}
.check{display:flex;gap:8px;align-items:center}
.table{width:100%;border-collapse:collapse} .table th{text-align:left;font-size:.78rem;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.table td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top} .table tbody tr{cursor:pointer} .table tbody tr:hover{background:#fafbfc}
.num{text-align:right;white-space:nowrap} .table-wrap{overflow-x:auto}
.list{list-style:none;margin:0;padding:0} .list li{padding:9px 0;border-bottom:1px solid var(--line)} .list li:last-child{border:0}
.list a{display:flex;gap:10px;align-items:baseline;color:var(--ink)}
.empty{padding:22px;text-align:center;color:var(--muted)}
.more{display:inline-block;margin-top:8px;font-weight:600}
.post{padding:10px 0;border-bottom:1px solid var(--line)} .post:last-of-type{border:0} .post p{margin:.25rem 0;white-space:pre-wrap} .post.pinned{background:#fffbea;margin:0 -10px;padding:10px;border-radius:8px}
.due{font-size:.78rem;font-weight:600;padding:1px 7px;border-radius:6px;background:#eef1f5;color:#475467;margin-left:6px;white-space:nowrap}
.due.scaduto{background:var(--bad-bg);color:var(--bad)} .due.oggi{background:var(--warn-bg);color:var(--warn)}
.checks{list-style:none;padding:0;margin:.4rem 0 0} .checks li{padding:4px 0} .checks label{display:inline-flex;gap:8px;align-items:center;cursor:pointer} .done{text-decoration:line-through;color:var(--muted)}
.group h3{margin-top:4px}
/* agenda */
.split{display:grid;grid-template-columns:340px 1fr;height:100vh}
.pane-list{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.list-tools{padding:14px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.list-tools.row{flex-direction:row;padding:0 0 14px;border:0;max-width:640px}
.filters{display:flex;gap:6px} .filters select{font-size:.85rem;padding:6px}
.clist{overflow-y:auto;flex:1;padding:6px}
.citem{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;color:var(--ink)} .citem:hover{background:#f3f5f8;text-decoration:none} .citem.sel{background:#e9eef5}
.cname{display:flex;flex-direction:column;min-width:0;font-weight:600} .cname small{color:var(--muted);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:#c4cad3} .dot.ok{background:var(--ok)} .dot.warn{background:#f0a500} .dot.bad{background:#d92d20}
.pane-detail{overflow-y:auto;min-height:0}
.ccard{padding:26px 30px 48px;max-width:1080px}
.chead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.back{display:none;margin-bottom:10px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:6px 0;border-bottom:1px dashed #edf0f3} .kv>span{color:var(--muted);font-size:.85rem}
.bars{display:flex;gap:10px;margin:10px 0} .bars div{flex:1;background:#f5f7fa;border-radius:10px;padding:8px 10px;display:flex;flex-direction:column} .bars strong{font-size:1.25rem}
.note-radix{background:#fffbea;border-radius:10px;padding:8px 12px;margin-top:10px} .note-radix p{margin:.2rem 0 0}
.timeline{list-style:none;margin:0;padding:0} .timeline li{padding:12px 0;border-bottom:1px solid var(--line)} .timeline li:last-child{border:0}
.timeline p{margin:.35rem 0;white-space:pre-wrap} .tl-head{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
a.plain{color:var(--ink)} a.plain:hover{text-decoration:none}
/* preventivi */
.results{display:flex;flex-direction:column;gap:4px;margin:8px 0;max-height:340px;overflow-y:auto}
.result{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;cursor:pointer;font:inherit;color:var(--ink)}
.result:hover{border-color:#b9c1cc;background:#fafbfc} .result:disabled{opacity:.55;cursor:not-allowed}
.r-desc{display:flex;flex-direction:column} .r-desc small{color:var(--muted)} .r-price{font-weight:700;white-space:nowrap}
.lvl{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap} .lvl.ok{background:var(--ok-bg);color:var(--ok)} .lvl.warn{background:var(--warn-bg);color:var(--warn)} .lvl.blocked{background:#eef1f5;color:#667085}
.lines td{vertical-align:middle} .lines td:first-child{min-width:240px} .lines td small{display:block}
.lines input{width:76px;text-align:right;padding:6px} .lines .qty{width:92px} .lines .disc input{width:62px}
.warnrow{background:#fffdf5}
.totals>div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0f2f5} .totals .grand{font-size:1.2rem;border-top:2px solid var(--ink);border-bottom:0;margin-top:4px;padding-top:10px}
.meter{display:flex;height:8px;background:#eef1f5;border-radius:6px;overflow:hidden;min-width:120px} .meter .ok{background:var(--ok)} .meter .warn{background:#f0a500}
/* login, modali, toast */
.login{max-width:420px;margin:12vh auto;display:flex;flex-direction:column;gap:12px;padding:28px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.brand-lg{font-size:1.9rem;font-weight:800;letter-spacing:.16em;color:var(--brand);margin-bottom:4px} .brand-lg span{display:block;font-size:.9rem;letter-spacing:.04em;color:var(--accent);font-weight:600}
.modal-back{position:fixed;inset:0;background:rgba(16,24,40,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:16px;width:min(560px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)} .modal-head h3{margin:0;color:var(--ink);font-size:1.05rem}
.modal-body{padding:16px 18px;overflow-y:auto} .modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--brand);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;z-index:60;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)} .toast.error{background:var(--bad)}
#print-root{display:none}
/* mobile e tablet */
@media (max-width:1000px){ .grid2{grid-template-columns:1fr} .split{grid-template-columns:300px 1fr} }
@media (max-width:760px){
  .shell{grid-template-columns:1fr} .side{display:none} .page{padding:18px 14px 90px} .ccard{padding:16px 14px 90px}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:20}
  .tabbar a{display:flex;flex-direction:column;align-items:center;color:var(--muted);font-size:.7rem} .tabbar a.active{color:var(--brand);font-weight:700} .tabbar .ico{font-size:1.15rem}
  .split{grid-template-columns:1fr;height:auto} .pane-list{border:0;min-height:calc(100vh - 60px)} .split.has-sel .pane-list{display:none} .split:not(.has-sel) .pane-detail{display:none}
  .back{display:inline-block} .kv{grid-template-columns:1fr} .form.two{grid-template-columns:1fr} .list-tools.row{flex-direction:column}
  .result{grid-template-columns:1fr auto} .result .lvl{grid-column:1/-1;justify-self:start}
}
/* stampa offerta: documento nel formato NORDTEX/RADIX (core/quote-doc.js) */
@media print{
  html,body{background:#fff!important} body>*:not(#print-root){display:none!important} #print-root{display:block} @page{size:A4;margin:10mm 12mm}
  #print-root .nt-doc{max-width:none} #print-root tr{break-inside:avoid} #print-root img{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print-root *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ---- Agenda: ricerca, legenda stati, colpo d'occhio ---- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.8rem;color:var(--ink);cursor:pointer;min-height:30px}
.chip b{font-weight:600;color:var(--muted)} .chip:hover{border-color:#c9ced6} .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)} .chip.on b{color:#cfd6de}
.filters{flex-wrap:wrap} .filters select{flex:1 1 0;min-width:0}
.citem .cname{flex:1;min-width:0} .citem .cname{overflow:hidden} .citem .cname>small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta{font-size:.72rem;color:var(--muted);white-space:nowrap;flex:none}
.citem:focus{outline:2px solid #3b82f6;outline-offset:-2px}
mark{background:#fff1a8;color:inherit;border-radius:2px;padding:0 1px}
.dot.big{width:16px;height:16px;margin-top:3px}
.glance{border-left:6px solid #c4cad3;padding-top:14px}
.glance.ok{border-left-color:var(--ok)} .glance.warn{border-left-color:#f0a500} .glance.bad{border-left-color:#d92d20}
.gl-status{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.gl-status strong{display:block;font-size:1.25rem} .gl-status span{display:block;color:var(--muted)} .gl-status em{display:block;font-style:normal;font-weight:600;margin-top:2px}
.glance.ok .gl-status em{color:var(--ok)} .glance.warn .gl-status em{color:var(--warn)} .glance.bad .gl-status em{color:var(--bad)}
.gl-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.gl-tile{background:#f5f7fa;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.gl-tile small{color:var(--muted);font-size:.75rem} .gl-tile strong{font-size:1.1rem;margin:2px 0} .gl-tile span{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gl-tile.warn{background:var(--warn-bg)} .gl-tile.warn strong{color:var(--warn)} .gl-tile.bad{background:var(--bad-bg)} .gl-tile.bad strong{color:var(--bad)}
.gl-trend{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:14px;align-items:end}
.gl-bars{display:flex;gap:14px;align-items:flex-end;height:120px;padding:0 4px}
.gl-bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.gl-bar i{display:block;width:100%;max-width:56px;background:#c9d3df;border-radius:6px 6px 2px 2px;min-height:3px}
.gl-bar.cur i{background:var(--brand)} .gl-bar small{font-size:.72rem;color:var(--muted);white-space:nowrap} .gl-val{font-size:.85rem;font-weight:600}
.gl-side small{color:var(--muted);font-size:.75rem} .gl-side p{margin:6px 0 0}
.gl-tr{font-weight:600} .gl-tr.su{color:var(--ok)} .gl-tr.giu{color:var(--bad)} .gl-tr.pari{color:var(--muted)}
.gl-foot{margin:12px 0 0;font-size:.72rem;color:var(--muted)}
@media (max-width:1180px){ .gl-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:760px){ .gl-trend{grid-template-columns:1fr} .gl-bars{height:100px} .chip{min-height:34px} .citem{padding:12px 10px} .filters select{font-size:16px} .list-tools input[type=search]{font-size:16px} }
.badge .dot{display:inline-block;vertical-align:middle;width:8px;height:8px;margin-top:-2px}
.split>*{min-width:0} .list-tools{min-width:0} .pane-detail{min-width:0}
/* Tablet (iPad verticale e finestre strette): menu laterale compatto a icone */
@media (min-width:761px) and (max-width:1100px){
  .shell{grid-template-columns:68px 1fr} .side{padding:18px 8px}
  .brand{padding:4px 0 18px;align-items:center} .brand .logo-mark{width:40px}
  .nav-item{justify-content:center;padding:11px 0} .nav-item span:not(.ico){display:none} .nav-item .ico{font-size:1.15rem}
  .who strong,.who small{display:none} .who{align-items:center} .who .link{text-align:center;font-size:.75rem}
  .split{grid-template-columns:300px 1fr} .ccard{padding:20px 18px 40px}
  .chead{flex-wrap:wrap} .gl-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* Nuovo cliente / stato Potenziale */
.dot.info{background:#2f7ae5} .badge.info{background:var(--info-bg);color:#1d5fbf} .glance.info{border-left-color:#2f7ae5} .glance.info .gl-status em{color:#1d5fbf}
.search-row{display:flex;gap:8px;align-items:center} .search-row input{flex:1;min-width:0} .search-row .btn{white-space:nowrap}
.form.three{display:grid;grid-template-columns:90px 1fr 70px;gap:10px}
.similar{display:flex;flex-direction:column;gap:4px;font-size:.85rem} .similar:empty{display:none} .similar small{color:var(--warn);font-weight:600}
.similar a{display:flex;align-items:center;gap:6px;color:var(--ink)}
@media (max-width:760px){ .form.three{grid-template-columns:80px 1fr 64px} .search-row .btn{padding:8px 10px} }
/* Telefono: niente scorrimento orizzontale della pagina; le tabelle scorrono nel loro riquadro */
.main{min-width:0}
@media (max-width:760px){
  html,body{overflow-x:hidden}
  table.table{display:block;overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
  .table-wrap{overflow-x:auto;max-width:100%}
  .page-head{flex-wrap:wrap} .page-head .actions{flex-wrap:wrap}
}
/* Trasporto e carico */
.tp{display:flex;flex-direction:column;gap:14px}
.tp-addr small,.tp-sc small{color:var(--muted);font-size:.78rem;font-weight:600}
.form.three-a{display:grid;grid-template-columns:2fr 80px 1.3fr 64px;gap:8px;margin-top:4px}
.tp-group{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tp-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tp-fill{display:flex;flex-direction:column;gap:5px;font-size:.88rem}
.tp-bar{height:10px;background:#eef1f5;border-radius:6px;overflow:hidden} .tp-bar i{display:block;height:100%;background:var(--brand);border-radius:6px}
.tp-km{display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.tp-km-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .tp-km-row input{width:100px}
.tp-cost{margin:0} .tp-cost strong{font-size:1.15rem}
